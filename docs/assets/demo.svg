<svg width="820" height="480" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal demo output">
  <defs>
    <linearGradient id="winbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="20" width="780" height="440" rx="14" fill="url(#winbg)" stroke="#30363d" stroke-width="1"/>
    <rect x="20" y="20" width="780" height="38" rx="14" fill="#21262d"/>
    <rect x="20" y="44" width="780" height="14" fill="#21262d"/>
    <circle cx="46" cy="39" r="6" fill="#ff5f56"/>
    <circle cx="66" cy="39" r="6" fill="#ffbd2e"/>
    <circle cx="86" cy="39" r="6" fill="#27c93f"/>
    <text x="410" y="44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13"
          fill="#8b949e" text-anchor="middle">bash security_audit.sh</text>
  </g>

  <!-- terminal body text (English sample for universal rendering — real CLI output is in Persian, see README) -->
  <g font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="14.5">
    <text x="40" y="90"  fill="#7ee787" font-weight="bold">=== Security Audit Tool -- version 1.0 ===</text>
    <text x="40" y="112" fill="#8b949e">Date: Fri Sep 4 2026     Env: Linux     User: you</text>

    <text x="40" y="146" fill="#58a6ff" font-weight="bold">============================================================</text>
    <text x="40" y="166" fill="#58a6ff" font-weight="bold">  1) Suspicious processes</text>
    <text x="40" y="186" fill="#58a6ff" font-weight="bold">============================================================</text>
    <text x="40" y="210" fill="#3fb950">[OK] No suspiciously-named process found.</text>
    <text x="40" y="232" fill="#3fb950">[OK] Nothing running from /tmp or /dev/shm.</text>

    <text x="40" y="266" fill="#58a6ff" font-weight="bold">============================================================</text>
    <text x="40" y="286" fill="#58a6ff" font-weight="bold">  2) Network connections</text>
    <text x="40" y="306" fill="#58a6ff" font-weight="bold">============================================================</text>
    <text x="40" y="330" fill="#3fb950">[OK] No suspicious established connections.</text>

    <text x="40" y="364" fill="#58a6ff" font-weight="bold">============================================================</text>
    <text x="40" y="384" fill="#58a6ff" font-weight="bold">  Final summary</text>
    <text x="40" y="404" fill="#58a6ff" font-weight="bold">============================================================</text>
    <text x="40" y="428" fill="#3fb950" font-weight="bold">System looks clean. No issues found.</text>

    <text x="40" y="452" fill="#e3b341">Full report (mode 600) saved to security_report_*.txt</text>
  </g>
</svg>
